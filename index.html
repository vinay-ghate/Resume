<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Archive Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f6f8fa; margin: 0; padding: 40px 20px; color: #24292f; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eaecef; padding-bottom: 10px; }
        .pdf-list { list-style: none; padding: 0; }
        .pdf-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #d0d7de; margin-bottom: 10px; border-radius: 6px; transition: background 0.2s; }
        .pdf-item:hover { background-color: #f3f4f6; }
        .pdf-name { font-weight: 600; font-size: 16px; word-break: break-all; }
        .download-btn { background-color: #2da44e; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; transition: 0.2s; white-space: nowrap; margin-left: 15px; }
        .download-btn:hover { background-color: #2c974b; }
        .loading { text-align: center; color: #57606a; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Document Archive</h1>
    <div id="loading" class="loading">Fetching latest PDFs...</div>
    <ul id="pdf-list" class="pdf-list"></ul>
</div>

<script>
    // Replace with your actual GitHub username and repository name
    const repo = "vinay-ghate/resume"; 
    const apiUrl = `https://api.github.com/repos/${repo}/releases/tags/pdf-archive`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            const list = document.getElementById('pdf-list');
            document.getElementById('loading').style.display = 'none';

            if (!data.assets || data.assets.length === 0) {
                list.innerHTML = '<li class="loading">No PDFs found in the archive yet.</li>';
                return;
            }

            // Sort newest files first (optional)
            const assets = data.assets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            assets.forEach(asset => {
                if (asset.name.endsWith('.pdf')) {
                    const li = document.createElement('li');
                    li.className = 'pdf-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'pdf-name';
                    nameSpan.textContent = asset.name;

                    const btn = document.createElement('a');
                    btn.className = 'download-btn';
                    btn.href = asset.browser_download_url;
                    btn.textContent = 'Download';
                    btn.target = '_blank';

                    li.appendChild(nameSpan);
                    li.appendChild(btn);
                    list.appendChild(li);
                }
            });
        })
        .catch(error => {
            document.getElementById('loading').innerHTML = 'Error loading PDFs. Please check the repository name in the script.';
            console.error('Error fetching release:', error);
        });
</script>

</body>
</html>
