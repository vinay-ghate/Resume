name: Compile All LaTeX Files to Archive

on:
  push:
    branches:
      - main

jobs:
  build_all_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Set your hardcoded name prefix variable
      - name: Setup Custom Variables
        run: |
          echo "AUTHOR_PREFIX=Vinay-Ghate" >> \$GITHUB_ENV

      # Step 3: Run a loop to detect, compile, and rename EVERY .tex file
      - name: Process and Compile All .tex Files
        run: |
          # Create a temporary output directory to hold all generated PDFs
          mkdir -p final_pdfs
          
          # Find all .tex files across the repository
          find . -name "*.tex" -type f | while read -r LATEST_TEX; do
            # Strip leading './'
            LATEST_TEX=\${LATEST_TEX#./}
            
            # Extract basic file name without extension
            FILE_NAME=(basename "LATEST_TEX" .tex)
            
            # Extract parent folder name
            FOLDER_NAME=\$(basename "(dirname "LATEST_TEX")")
            if [ "\$FOLDER_NAME" = "." ] || [ "\(FOLDER_NAME" = "" ] \vert{}\vert{} [ "\)FOLDER_NAME" = "/" ]; then
              FOLDER_NAME="root"
            fi
            
            # Format the custom PDF filename
            CUSTOM_NAME="\({{ env.AUTHOR_PREFIX }}-\){FOLDER_NAME}-\({FILE_NAME}-build\){{ github.run_number }}.pdf"
            
            echo "----------------------------------------------------"
            echo "Compiling file: \$LATEST_TEX"
            echo "Target output: \$CUSTOM_NAME"
            echo "----------------------------------------------------"
            
            # Run the LaTeX compilation tool directly inside the container
            docker run --rm -v "\$(pwd):/workdir" xucheng/texlive latexmk -pdf -halt-on-error "/workdir/\$LATEST_TEX"
            
            # If compilation succeeded, rename and move the PDF to our staging folder
            if [ -f "\${FILE_NAME}.pdf" ]; then
              mv "\({FILE_NAME}.pdf" "final_pdfs/\){CUSTOM_NAME}"
            else
              echo "Warning: \${FILE_NAME}.pdf was not generated."
            fi
          done

      # Step 4: Push all raw PDFs to the permanent Archive Release at once
      - name: Upload All to Permanent Release Archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-archive
          name: "LaTeX PDF Build Archive"
          body: "This release contains all historical raw PDF builds compiled by GitHub Actions."
          draft: false
          prerelease: false
          files: final_pdfs/*.pdf
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

      # Step 5: Print the download dashboard link
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 All PDFs Uploaded to Archive!" >> \$GITHUB_STEP_SUMMARY
          echo "Every \`.tex\` file in your repository has been compiled and saved." >> \$GITHUB_STEP_SUMMARY
          echo "👉 **[View All Raw PDF Builds (Including Older Versions)](https://github.com{{ github.repository }}/releases/tag/pdf-archive)**" >> \$GITHUB_STEP_SUMMARY
