name: Compile All LaTeX Files to Archive

on:
  push:
    branches:
      - main

jobs:
  build_all_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Set your hardcoded name prefix variable
      - name: Setup Custom Variables
        run: |
          echo "AUTHOR_PREFIX=Vinay-Ghate" >> \$GITHUB_ENV

      # Step 3: Find and Compile EVERY .tex file using the marketplace action
      - name: Compile All LaTeX files
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            **/*.tex

      # Step 4: Organize and rename PDFs using clean, safe Bash syntax
      - name: Rename and Move PDFs
        run: |
          mkdir -p final_pdfs
          
          # Find all compiled PDFs in the workspace
          find . -name "*.pdf" -not -path "./final_pdfs/*" -type f | while read -r pdf_path; do
            # Extract basic file name without path and extension
            file_base=\((basename "\)pdf_path" .pdf)
            
            # Extract parent directory name
            dir_path=\((dirname "\)pdf_path")
            folder_name=\((basename "\)dir_path")
            
            # Fallback if the file is in the root directory
            if [ "\(folder_name" = "." ] \vert{}\vert{} [ "\)folder_name" = "" ]; then
              folder_name="root"
            fi
            
            # Form your exact requested custom name format
            custom_name="\({{ env.AUTHOR_PREFIX }}-\){folder_name}-\({file_base}-build\){{ github.run_number }}.pdf"
            
            echo "Moving \$pdf_path to final_pdfs/\$custom_name"
            mv "\(pdf_path" "final_pdfs/\)custom_name"
          done

      # Step 5: Push all raw PDFs to the permanent Archive Release
      - name: Upload All to Permanent Release Archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-archive
          name: "LaTeX PDF Build Archive"
          body: "This release contains all historical raw PDF builds compiled by GitHub Actions."
          draft: false
          prerelease: false
          files: final_pdfs/*.pdf
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

      # Step 6: Print the download dashboard link
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 All PDFs Uploaded to Archive!" >> \$GITHUB_STEP_SUMMARY
          echo "Every \`.tex\` file in your repository has been compiled and saved." >> \$GITHUB_STEP_SUMMARY
          echo "👉 **[View All Raw PDF Builds (Including Older Versions)](https://github.com{{ github.repository }}/releases/tag/pdf-archive)**" >> \$GITHUB_STEP_SUMMARY
