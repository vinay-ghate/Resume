name: Compile LaTeX to PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Get current date for the custom file name
      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Step 3: Find the latest modified .tex file and apply the naming format
      - name: Detect latest modified .tex file
        id: detect_file
        run: |
          LATEST_TEX=$(find . -name "*.tex" -type f -printf '%T@ %p\n' | sort -rn | head -n 1 | awk '{print $2}')
          LATEST_TEX=${LATEST_TEX#./}
          BASE_NAME=$(basename "$LATEST_TEX" .tex)
          
          # Custom Naming Format: [OriginalName]-[YYYY-MM-DD]-build-[RunNumber].pdf
          CUSTOM_NAME="${BASE_NAME}-${{ env.DATE }}-build-${{ github.run_number }}.pdf"
          
          echo "TEX_FILE=$LATEST_TEX" >> $GITHUB_ENV
          echo "ORIGINAL_BASE=$BASE_NAME" >> $GITHUB_ENV
          echo "CUSTOM_PDF_NAME=$CUSTOM_NAME" >> $GITHUB_ENV

      # Step 4: Compile the LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_FILE }}

      # Step 5: Rename the output PDF to your custom format
      - name: Rename PDF to custom format
        run: |
          mv "${{ env.ORIGINAL_BASE }}.pdf" "${{ env.CUSTOM_PDF_NAME }}"

      # Step 6: Upload the custom-named PDF artifact
      - name: Upload PDF artifact
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_PDF_NAME }}
          path: ${{ env.CUSTOM_PDF_NAME }}

      # Step 7: Display the direct link in the workflow summary
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 PDF Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "You can download your formatted PDF directly using this link:" >> $GITHUB_STEP_SUMMARY
          echo "[Download ${{ env.CUSTOM_PDF_NAME }}](${{ steps.artifact-upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
