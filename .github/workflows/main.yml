name: Compile LaTeX to PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Detect the latest file, its folder, and apply your exact naming format
      - name: Detect latest modified .tex file and format name
        id: detect_file
        run: |
          # 1. Find the latest modified .tex file
          LATEST_TEX=$(find . -name "*.tex" -type f -printf '%T@ %p\n' | sort -rn | head -n 1 | awk '{print $2}')
          LATEST_TEX=${LATEST_TEX#./}
          
          # 2. Extract the file name without the extension (.tex)
          FILE_NAME=$(basename "$LATEST_TEX" .tex)
          
          # 3. Extract the parent folder name. If it's in the root directory, default to "root"
          FOLDER_NAME=$(basename "$(dirname "$LATEST_TEX")")
          if [ "$FOLDER_NAME" = "." ] || [ "$FOLDER_NAME" = "" ]; then
            FOLDER_NAME="root"
          fi
          
          # 4. Create your custom naming format
          CUSTOM_NAME="Vinay-Ghate-${FOLDER_NAME}-${FILE_NAME}.pdf"
          
          echo "Detected File: $LATEST_TEX"
          echo "Generated PDF Name: $CUSTOM_NAME"
          
          # Save variables to GitHub Environment for subsequent steps
          echo "TEX_FILE=$LATEST_TEX" >> $GITHUB_ENV
          echo "ORIGINAL_BASE=$FILE_NAME" >> $GITHUB_ENV
          echo "CUSTOM_PDF_NAME=$CUSTOM_NAME" >> $GITHUB_ENV

      # Step 3: Compile the LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_FILE }}

      # Step 4: Rename the output PDF to your custom format
      - name: Rename PDF to custom format
        run: |
          mv "${{ env.ORIGINAL_BASE }}.pdf" "${{ env.CUSTOM_PDF_NAME }}"

      # Step 5: Upload the custom-named PDF artifact
      - name: Upload PDF artifact
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CUSTOM_PDF_NAME }}
          path: ${{ env.CUSTOM_PDF_NAME }}

      # Step 6: Display the direct link in the workflow summary
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 PDF Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "You can download your formatted PDF directly using this link:" >> $GITHUB_STEP_SUMMARY
          echo "[Download ${{ env.CUSTOM_PDF_NAME }}](${{ steps.artifact-upload.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
