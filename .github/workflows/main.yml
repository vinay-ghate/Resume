name: Compile LaTeX to Permanent Archive

on:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload and update release assets
    steps:
      # Step 1: Check out the repository
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Set your hardcoded name variable
      - name: Setup Custom Variables
        run: |
          echo "AUTHOR_PREFIX=Vinay-Ghate" >> $GITHUB_ENV

      # Step 3: Detect the latest file, its folder, and apply your exact naming format
      - name: Detect latest modified .tex file and format name
        id: detect_file
        run: |
          LATEST_TEX=$(find . -name "*.tex" -type f -printf '%T@ %p\n' | sort -rn | head -n 1 | awk '{print $2}')
          LATEST_TEX=${LATEST_TEX#./}
          FILE_NAME=$(basename "$LATEST_TEX" .tex)
          
          FOLDER_NAME=$(basename "$(dirname "$LATEST_TEX")")
          if [ "$FOLDER_NAME" = "." ] || [ "$FOLDER_NAME" = "" ]; then
            FOLDER_NAME="root"
          fi
          
          # Add a tiny unique timestamp or run number so files never overwrite each other
          CUSTOM_NAME="${{ env.AUTHOR_PREFIX }}-${FOLDER_NAME}-${FILE_NAME}-build${{ github.run_number }}.pdf"
          
          echo "TEX_FILE=$LATEST_TEX" >> $GITHUB_ENV
          echo "ORIGINAL_BASE=$FILE_NAME" >> $GITHUB_ENV
          echo "CUSTOM_PDF_NAME=$CUSTOM_NAME" >> $GITHUB_ENV

      # Step 4: Compile the LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_FILE }}

      # Step 5: Rename the output PDF to your custom format
      - name: Rename PDF to custom format
        run: |
          mv "${{ env.ORIGINAL_BASE }}.pdf" "${{ env.CUSTOM_PDF_NAME }}"

      # Step 6: Push the raw PDF to the permanent Archive Release
      - name: Upload to Permanent Release Archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-archive
          name: "LaTeX PDF Build Archive"
          body: "This release contains all historical raw PDF builds compiled by GitHub Actions."
          draft: false
          prerelease: false
          files: ${{ env.CUSTOM_PDF_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Print the download dashboard link
      - name: Generate Direct Download Link
        run: |
          echo "### 📄 PDF Uploaded to Archive!" >> $GITHUB_STEP_SUMMARY
          echo "Your raw PDF has been successfully added to the central archive." >> $GITHUB_STEP_SUMMARY
          echo "👉 **[View All Raw PDF Builds (Including Older Versions)](https://github.com{{ github.repository }}/releases/tag/pdf-archive)**" >> $GITHUB_STEP_SUMMARY
